name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install systemd development headers
        run: |
          sudo dpkg --add-architecture arm64

          if [ -f /etc/os-release ]; then
            . /etc/os-release
            ubuntu_codename="${VERSION_CODENAME}"
          else
            ubuntu_codename="noble"
          fi

          if [ -f /etc/apt/sources.list.d/ubuntu.sources ]; then
            sudo sed -i '/^Types: deb/a Architectures: amd64 i386' /etc/apt/sources.list.d/ubuntu.sources
          fi

          sudo tee /etc/apt/sources.list.d/arm64.sources >/dev/null <<EOF
          Types: deb
          URIs: http://ports.ubuntu.com/ubuntu-ports
          Suites: ${ubuntu_codename} ${ubuntu_codename}-updates ${ubuntu_codename}-backports ${ubuntu_codename}-security
          Components: main restricted universe multiverse
          Architectures: arm64
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          EOF

          sudo apt-get update
          sudo apt-get install -y \
            gcc \
            pkg-config \
            libsystemd-dev \
            gcc-aarch64-linux-gnu \
            libsystemd-dev:arm64

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
